name: Authorized history cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'namaz-vakytylary/Namaz-Safadzhay-2026' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify reviewed bundle and perform atomic ref update
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          bundle=.github/maintenance/sanitized-history.bundle
          echo "da88a8886153a1591644a821977ab499dff2e5d3998e62d5622b75b43d1303a8  $bundle" | sha256sum --check
          git bundle verify "$bundle"
          git fetch "$bundle" \
            refs/heads/main:refs/cleanup/main \
            refs/heads/test/1.2-test3-security:refs/cleanup/source \
            refs/heads/backup/main-before-stable-1.3-20261001:refs/cleanup/backup
          test "$(git rev-parse refs/cleanup/main)" = 088c73df958fa946cdd5c09be77bf3e9149a37f0
          test "$(git rev-parse refs/cleanup/source)" = a7d46f43596b6b776151e9d9fdf64cc4e8a69a44
          test "$(git rev-parse refs/cleanup/backup)" = 212e68680e77f5ebb55dbee2dbbe59ebddc709f4
          test "$(git rev-parse 'refs/cleanup/main^{tree}')" = 43296cb73306d4c87045287dda8087cc53d96c0f
          test "$(git rev-parse 'refs/cleanup/source^{tree}')" = bf653c4f5ec872653d367e7ab4a32836b824c6d2
          test "$(git rev-parse 'refs/cleanup/backup^{tree}')" = 207fbc3d7587957eda2f8c86aa82f5b0be5f2379
          git -c credential.helper='!gh auth git-credential' push --atomic \
            "--force-with-lease=refs/heads/main:$EXPECTED_MAIN" \
            --force-with-lease=refs/heads/test/1.2-test3-security:64c41c270d776d660043cd3bc64a41a636e7e973 \
            --force-with-lease=refs/heads/backup/main-before-stable-1.3-20261001:cad84c8df708ffff9f894d366e14232ab129801f \
            origin \
            refs/cleanup/main:refs/heads/main \
            refs/cleanup/source:refs/heads/test/1.2-test3-security \
            refs/cleanup/backup:refs/heads/backup/main-before-stable-1.3-20261001
          git ls-remote --heads origin > history-cleanup-result.txt
          cat history-cleanup-result.txt
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: history-cleanup-verification
          path: history-cleanup-result.txt
          if-no-files-found: ignore
          retention-days: 14
