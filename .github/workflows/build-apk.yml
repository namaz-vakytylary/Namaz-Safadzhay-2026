name: Build Namaz Vakytylary RELEASE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show app version
        run: |
          echo "=== App version ==="
          grep -n "versionCode" app/build.gradle.kts || true
          grep -n "versionName" app/build.gradle.kts || true
          grep -n "applicationId" app/build.gradle.kts || true

      - name: Build RELEASE APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK exists
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: app-release.apk not found"
            find app/build -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Show package and version
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "^package:"

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v5
        with:
          name: Namaz-Vakytylary-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
