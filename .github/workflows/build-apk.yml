- name: Extract zip and fix app folder structure
        run: |
          mkdir -p temp_extracted
          unzip -o app.zip -d temp_extracted/

          # Ищем папку, где лежит src
          SRC_DIR=$(find temp_extracted -type d -name "src" | head -n 1 | xargs dirname)

          if [ -z "$SRC_DIR" ]; then
            echo "ОШИБКА: Исходные файлы Android (папка src) не найдены в архиве!"
            exit 1
          fi

          echo "Исходники найдены в: $SRC_DIR"
          mkdir -p app

          # Копируем абсолютно ВСЕ файлы (включая скрытые) из найденной директории в app/
          shopt -s dotglob
          cp -r "$SRC_DIR"/* app/
          shopt -u dotglob

          # Если build.gradle.kts случайно скопировался в корень app, проверяем структуру
          ls -la app/
