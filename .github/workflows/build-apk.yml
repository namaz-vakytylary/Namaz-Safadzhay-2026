- name: Extract ALL ZIP archives
        shell: bash
        run: |
          set -e

          echo "=== Поиск ZIP-архивов ==="

          FOUND=0

          for ZIP_FILE in ./*.zip; do
            if [ -f "$ZIP_FILE" ]; then
              FOUND=1
              echo "Распаковываю: $ZIP_FILE"
              unzip -o "$ZIP_FILE" -d .
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "ZIP-архивы не найдены — продолжаю без распаковки"
          fi

          echo "=== Содержимое после распаковки ==="
          ls -la

          echo "=== Проверка Android-проекта ==="

          if [ ! -d "app" ]; then
            echo "ERROR: папка app не найдена"
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts не найден"
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew не найден"
            exit 1
          fi

          echo "OK: Android-проект найден"
