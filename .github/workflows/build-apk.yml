name: Build Namaz Vakytylary RELEASE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Remove previous app build output
        shell: bash
        run: rm -rf app/build

      - name: Build RELEASE APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Check RELEASE APK exists
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          echo "RELEASE APK successfully created"

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v5
        with:
          name: Namaz-Vakytylary-v1.0-RELEASE-RuStore
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
