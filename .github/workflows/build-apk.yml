name: Build Namaz Vakytylary TEST offline schedules

on:
  push:
    branches: ["test/1.2-test3", "test/1.2-test3-silent-updates"]
  workflow_dispatch:

jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/test/1.2-test3')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show app version
        run: |
          echo "=== App version ==="
          grep -n "versionCode" app/build.gradle.kts || true
          grep -n "versionName" app/build.gradle.kts || true
          grep -n "applicationId" app/build.gradle.kts || true

      - name: Check original timetable and test identity
        run: python3 scripts/preflight.py

      - name: Unit tests and lint
        run: ./gradlew --no-daemon clean :app:testReleaseUnitTest :app:lintRelease

      - name: Build RELEASE APK
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK exists
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: app-release.apk not found"
            find app/build -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Show package and version
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "^package:"

      - name: Verify test package and permissions
        run: bash scripts/verify-apk.sh

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Namaz-TEST-verification
          path: |
            app/build/reports/tests/testReleaseUnitTest
            app/build/reports/lint-results-release.html
            app/build/test-results/testReleaseUnitTest
          if-no-files-found: ignore

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v5
        with:
          name: Namaz-Vakytylary-TEST-1.2-test3.1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
