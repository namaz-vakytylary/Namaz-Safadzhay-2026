      - name: Inspect app.zip structure
        run: |
          echo "=== 1. Проверка наличия архива ==="
          if [ ! -f "app.zip" ]; then
            echo "ОШИБКА: Файл app.zip не найден в корне репозитория!"
            exit 1
          fi

          echo "=== 2. Распаковка архива ==="
          mkdir -p temp_inspect
          unzip -o app.zip -d temp_inspect/

          echo "=== 3. Полное дерево файлов внутри app.zip ==="
          find temp_inspect -maxdepth 5 | sort

          echo "=== 4. Поиск ключевых файлов Android ==="
          echo "Поиск MainActivity:"
          find temp_inspect -name "MainActivity.kt" -o -name "MainActivity.java"

          echo "Поиск файлов build.gradle / build.gradle.kts:"
          find temp_inspect -name "build.gradle*"
