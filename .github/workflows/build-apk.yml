name: Build Namaz APK from ZIPs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP archives
        run: |
          echo "=== Распаковка архивов ==="
          if [ -f "app.zip" ]; then unzip -o app.zip; fi
          if [ -f "gradle.zip" ]; then unzip -o gradle.zip; fi
          if [ -f "github.zip" ]; then unzip -o github.zip; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Safadzhay-2026-APK
          path: 'app/build/outputs/apk/debug/*.apk'
