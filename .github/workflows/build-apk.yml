name: Unpack app.zip

on:
  push:
    branches: [ "main" ] # Укажите ветку (main или master)

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает боту права на запись изменений в репозиторий
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app.zip
        run: |
          unzip app.zip -d ./extracted_files

      - name: Commit and push unzipped files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add extracted_files/
          git commit -m "Автоматическая распаковка app.zip" || exit 0
          git push
