name: Build Namaz Vakytylary RELEASE from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract ZIP archives
        shell: bash
        run: |
          set -e

          echo "=== Распаковка архивов ==="

          if [ -f "app.zip" ]; then
            echo "Распаковываю app.zip"
            unzip -o app.zip
          fi

          if [ -f "github.zip" ]; then
            echo "Распаковываю github.zip"
            unzip -o github.zip
          fi

          echo "=== Файлы после распаковки ==="
          ls -la

          echo "=== Папка app ==="
          ls -la app || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build signed RELEASE APK
        shell: bash
        run: |
          set -e

          echo "=== Проверка Gradle ==="

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
          else
            echo "gradlew не найден"
            exit 1
          fi

      - name: Verify RELEASE APK exists
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: app-release.apk не найден"
            echo "Найденные APK:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "OK: найден RELEASE APK"
          ls -lh "$APK"

      - name: Check APK is not DEBUG
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"

          "$AAPT" dump badging "$APK" > apk-info.txt
          cat apk-info.txt

          if grep -q "application-debuggable" apk-info.txt; then
            echo "ERROR: APK является DEBUG-сборкой"
            exit 1
          fi

          echo "OK: APK не является DEBUG"

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v5
        with:
          name: Namaz-Vakytylary-v1.0-RELEASE-RuStore
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
