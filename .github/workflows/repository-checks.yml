name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Repository security and preflight
        run: |
          python3 scripts/repository-security.py
          python3 scripts/preflight.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Unit tests
        run: bash ./gradlew --no-daemon :app:testReleaseUnitTest
      - name: Android lint
        run: bash ./gradlew --no-daemon :app:lintRelease
      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: repository-checks-${{ github.run_id }}
          path: |
            app/build/reports/tests/testReleaseUnitTest
            app/build/test-results/testReleaseUnitTest
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14
